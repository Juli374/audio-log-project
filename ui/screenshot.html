<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>AudioLog — Скриншот</title>
<style>
/* Same look as the history window: macOS 26 system colours, a segmented
   tool picker, capsule buttons. Measured NSColor values, with the live
   system colours taking over where WebKit exposes them. */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    color-scheme: light dark;
    --bg: #ffffff;
    --group: rgba(0, 0, 0, 0.05);
    --fill: rgba(0, 0, 0, 0.08);
    --hover: rgba(0, 0, 0, 0.045);
    --label: rgba(0, 0, 0, 0.847);
    --label-2: rgba(0, 0, 0, 0.498);
    --separator: rgba(0, 0, 0, 0.098);
    --accent: #007aff;
    --stage: #f2f2f2;
    --seg-on: #ffffff;
    --seg-shadow: 0 1px 3px rgba(0, 0, 0, 0.16), 0 0 0 0.5px rgba(0, 0, 0, 0.06);
    --swatch-ring: rgba(0, 0, 0, 0.16);
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg: #1e1e1e;
        --group: rgba(255, 255, 255, 0.06);
        --fill: rgba(255, 255, 255, 0.1);
        --hover: rgba(255, 255, 255, 0.055);
        --label: rgba(255, 255, 255, 0.847);
        --label-2: rgba(255, 255, 255, 0.549);
        --separator: rgba(255, 255, 255, 0.098);
        --stage: #141414;
        --seg-on: rgba(255, 255, 255, 0.2);
        --seg-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        --swatch-ring: rgba(255, 255, 255, 0.3);
    }
}

@supports (color: -apple-system-label) {
    :root {
        --label: -apple-system-label;
        --label-2: -apple-system-secondary-label;
        --separator: -apple-system-separator;
        --accent: -apple-system-control-accent;
    }
}

html, body { height: 100%; }

body {
    font: 13px/1.4 system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--label);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* Toolbar */
.toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--separator);
    background: var(--bg);
    flex-shrink: 0;
}

.tools {
    display: inline-flex;
    gap: 2px;
    padding: 2px;
    border-radius: 9px;
    background: var(--group);
}

.tool {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 26px;
    padding: 0 10px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--label);
    font: 500 12.5px/1 system-ui, -apple-system, sans-serif;
    cursor: default;
}
.tool:hover:not(.active) { background: var(--hover); }
.tool.active { background: var(--seg-on); box-shadow: var(--seg-shadow); font-weight: 600; }
.tool svg { width: 15px; height: 15px; flex-shrink: 0; }

.colors { display: flex; align-items: center; gap: 8px; padding: 0 2px; }
.swatch {
    position: relative;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    box-shadow: inset 0 0 0 1px var(--swatch-ring);
    cursor: default;
    transition: transform 0.1s;
}
.swatch:hover { transform: scale(1.1); }
.swatch.active::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px solid var(--accent);
}

.spacer { flex: 1; }

.btn {
    height: 28px;
    padding: 0 16px;
    border-radius: 14px;
    border: none;
    background: var(--fill);
    color: var(--label);
    font: 500 13px/1 system-ui, -apple-system, sans-serif;
    cursor: default;
    white-space: nowrap;
}
.btn:hover { filter: brightness(0.97); }
.btn:active { filter: brightness(0.92); }
.btn:disabled { opacity: 0.4; filter: none; }
.btn.primary {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
}

/* Stage */
.stage {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--stage);
    padding: 12px;
    overflow: hidden;
}
canvas {
    display: block;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.2), 0 0 0 0.5px rgba(0, 0, 0, 0.12);
    cursor: crosshair;
    touch-action: none;
    background: var(--bg);
}

/* Footer */
.footer {
    flex-shrink: 0;
    padding: 6px 14px 7px;
    font-size: 11px;
    color: var(--label-2);
    background: var(--bg);
    border-top: 1px solid var(--separator);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
kbd {
    font: 500 10.5px/1 system-ui, -apple-system, sans-serif;
    padding: 2px 5px;
    border-radius: 4px;
    background: var(--group);
    color: var(--label);
}
</style>
</head>
<body>

<div class="toolbar">
    <div class="tools">
    <button class="tool active" data-tool="arrow" title="Стрелка (A)">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16 L15 5"/><path d="M8.5 5 H15 V11.5"/></svg>
        Стрелка
    </button>
    <button class="tool" data-tool="rect" title="Рамка (R)">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4.5" width="14" height="11" rx="1.5"/></svg>
        Рамка
    </button>
    <button class="tool" data-tool="line" title="Линия (L)">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 16 L16 4"/></svg>
        Линия
    </button>
    <button class="tool" data-tool="check" title="Галочка (V)">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 L8 15 L16.5 5"/></svg>
        Галочка
    </button>
    </div>
    <div class="colors" id="colors"></div>
    <div class="spacer"></div>
    <button class="btn" id="undoBtn" title="Отменить последнее (⌘Z)">Отменить</button>
    <button class="btn primary" id="copyBtn" title="Скопировать и закрыть (Enter)">Копировать</button>
</div>

<div class="stage" id="stage">
    <canvas id="canvas" width="0" height="0"></canvas>
</div>

<div class="footer">
    <kbd>Enter</kbd> скопировать и закрыть &nbsp;·&nbsp;
    <kbd>Esc</kbd> закрыть &nbsp;·&nbsp;
    <kbd>⌘Z</kbd> отменить &nbsp;·&nbsp;
    <kbd>A</kbd> <kbd>R</kbd> <kbd>L</kbd> <kbd>V</kbd> инструменты &nbsp;·&nbsp;
    <kbd>1</kbd>–<kbd>6</kbd> цвет
</div>

<script>
// Six colours, red first — red is what a mark-up almost always is.
const COLORS = ['#ff3b30', '#ff9f0a', '#30d158', '#0a84ff', '#ffffff', '#1d1d1f'];

// Arrows are drawn a touch slimmer than the other marks: shaft and head
// both, 5%. Kept fractional — rounding to whole pixels would swallow it.
const ARROW_SLIM = 0.95;

const bridge = (window.webkit && window.webkit.messageHandlers
                && window.webkit.messageHandlers.bridge) || null;

function send(action, extra) {
    const msg = Object.assign({ action }, extra || {});
    if (bridge) bridge.postMessage(msg);
    else console.log('bridge:', msg.action);   // opened in a plain browser
}

const editor = {
    canvas: null,
    ctx: null,
    img: null,
    scale: 1,        // backing scale of the shot: 2 on Retina
    shapes: [],
    draft: null,     // the shape being dragged out right now
    tool: 'arrow',
    color: COLORS[0],

    init() {
        this.canvas = document.getElementById('canvas');
        this.ctx = this.canvas.getContext('2d');

        const box = document.getElementById('colors');
        COLORS.forEach((c, i) => {
            const el = document.createElement('div');
            el.className = 'swatch' + (i === 0 ? ' active' : '');
            el.style.background = c;
            el.title = 'Цвет ' + (i + 1);
            el.onclick = () => this.setColor(c);
            box.appendChild(el);
        });

        document.querySelectorAll('.tool').forEach(b => {
            b.onclick = () => this.setTool(b.dataset.tool);
        });
        document.getElementById('undoBtn').onclick = () => this.undo();
        document.getElementById('copyBtn').onclick = () => this.copy();

        this.canvas.addEventListener('pointerdown', e => this.onDown(e));
        this.canvas.addEventListener('pointermove', e => this.onMove(e));
        this.canvas.addEventListener('pointerup', e => this.onUp(e));
        this.canvas.addEventListener('pointercancel', () => this.cancelDraft());
        document.addEventListener('keydown', e => this.onKey(e));
        window.addEventListener('resize', () => this.fit());
        // The stage gets its size from flex layout; follow it, so the shot
        // is right even when the window is resized after loading.
        if (window.ResizeObserver) {
            new ResizeObserver(() => this.fit())
                .observe(document.getElementById('stage'));
        }

        this.updateButtons();
        send('ready');
    },

    // Called from Python with the freshly taken shot.
    load(dataUrl, scale) {
        const img = new Image();
        img.onload = () => {
            this.img = img;
            this.scale = scale || 1;
            this.shapes = [];
            this.draft = null;
            this.canvas.width = img.naturalWidth;
            this.canvas.height = img.naturalHeight;
            this.fit();
            requestAnimationFrame(() => this.fit());
            this.redraw();
            this.updateButtons();
        };
        img.src = dataUrl;
    },

    // Show the shot at its on-screen size (pixels ÷ scale, so it stays
    // crisp on Retina), shrunk only when the window is smaller than that.
    fit() {
        if (!this.img) return;
        const stage = document.getElementById('stage');
        const availW = stage.clientWidth - 24;
        const availH = stage.clientHeight - 24;
        if (availW < 40 || availH < 40) return;   // layout not ready yet
        const ptW = this.canvas.width / this.scale;
        const ptH = this.canvas.height / this.scale;
        const k = Math.min(1, availW / ptW, availH / ptH);
        this.canvas.style.width = Math.max(1, Math.round(ptW * k)) + 'px';
        this.canvas.style.height = Math.max(1, Math.round(ptH * k)) + 'px';
    },

    lineWidth() {
        return Math.max(2, Math.round(3.5 * this.scale));
    },

    // Pointer position in canvas pixels.
    pos(e) {
        const r = this.canvas.getBoundingClientRect();
        return {
            x: (e.clientX - r.left) * this.canvas.width / r.width,
            y: (e.clientY - r.top) * this.canvas.height / r.height,
        };
    },

    onDown(e) {
        if (!this.img || e.button !== 0) return;
        e.preventDefault();
        this.canvas.setPointerCapture(e.pointerId);
        const p = this.pos(e);
        this.draft = { type: this.tool, color: this.color,
                       x0: p.x, y0: p.y, x1: p.x, y1: p.y };
    },

    onMove(e) {
        if (!this.draft) return;
        const p = this.pos(e);
        this.draft.x1 = p.x;
        this.draft.y1 = p.y;
        this.redraw();
    },

    onUp(e) {
        if (!this.draft) return;
        const p = this.pos(e);
        const s = this.draft;
        s.x1 = p.x;
        s.y1 = p.y;
        this.draft = null;

        const min = 4 * this.scale;
        const moved = Math.abs(s.x1 - s.x0) > min || Math.abs(s.y1 - s.y0) > min;
        if (s.type === 'check') {
            // A plain click drops a check of a sensible size; a drag sizes it.
            if (!moved) {
                const d = 20 * this.scale;
                s.x0 -= d; s.y0 -= d; s.x1 = s.x0 + 2 * d; s.y1 = s.y0 + 2 * d;
            }
            this.shapes.push(s);
        } else if (moved) {
            this.shapes.push(s);
        }
        this.redraw();
        this.updateButtons();
    },

    cancelDraft() {
        this.draft = null;
        this.redraw();
    },

    redraw() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        if (this.img) ctx.drawImage(this.img, 0, 0);
        for (const s of this.shapes) this.draw(s);
        if (this.draft) this.draw(this.draft);
    },

    draw(s) {
        const ctx = this.ctx;
        const lw = this.lineWidth() * (s.type === 'arrow' ? ARROW_SLIM : 1);
        ctx.save();
        ctx.strokeStyle = s.color;
        ctx.fillStyle = s.color;
        ctx.lineWidth = lw;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        // A soft shadow keeps a red arrow readable on a red button and a
        // white one readable on a white page.
        ctx.shadowColor = 'rgba(0,0,0,0.35)';
        ctx.shadowBlur = lw;
        switch (s.type) {
            case 'rect': this.drawRect(s, lw); break;
            case 'line': this.drawLine(s); break;
            case 'arrow': this.drawArrow(s, lw); break;
            case 'check': this.drawCheck(s, lw); break;
        }
        ctx.restore();
    },

    drawRect(s, lw) {
        const ctx = this.ctx;
        const x = Math.min(s.x0, s.x1), y = Math.min(s.y0, s.y1);
        const w = Math.abs(s.x1 - s.x0), h = Math.abs(s.y1 - s.y0);
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x, y, w, h, Math.min(lw, w / 2, h / 2));
        else ctx.rect(x, y, w, h);
        ctx.stroke();
    },

    drawLine(s) {
        const ctx = this.ctx;
        ctx.beginPath();
        ctx.moveTo(s.x0, s.y0);
        ctx.lineTo(s.x1, s.y1);
        ctx.stroke();
    },

    drawArrow(s, lw) {
        const ctx = this.ctx;
        const dx = s.x1 - s.x0, dy = s.y1 - s.y0;
        const len = Math.hypot(dx, dy);
        if (len < 1) return;
        const ang = Math.atan2(dy, dx);
        const head = Math.min(Math.max(lw * 3.4, 14 * this.scale * ARROW_SLIM), len);
        // The shaft stops short so the tip of the head stays sharp.
        ctx.beginPath();
        ctx.moveTo(s.x0, s.y0);
        ctx.lineTo(s.x1 - Math.cos(ang) * head * 0.75,
                   s.y1 - Math.sin(ang) * head * 0.75);
        ctx.stroke();
        const a = Math.PI / 7;
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x1 - head * Math.cos(ang - a), s.y1 - head * Math.sin(ang - a));
        ctx.lineTo(s.x1 - head * Math.cos(ang + a), s.y1 - head * Math.sin(ang + a));
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    },

    drawCheck(s, lw) {
        const ctx = this.ctx;
        const x = Math.min(s.x0, s.x1), y = Math.min(s.y0, s.y1);
        const w = Math.max(Math.abs(s.x1 - s.x0), lw * 3);
        const h = Math.max(Math.abs(s.y1 - s.y0), lw * 3);
        ctx.lineWidth = lw * 1.3;
        ctx.beginPath();
        ctx.moveTo(x + w * 0.08, y + h * 0.56);
        ctx.lineTo(x + w * 0.38, y + h * 0.88);
        ctx.lineTo(x + w * 0.94, y + h * 0.12);
        ctx.stroke();
    },

    setTool(t) {
        this.tool = t;
        document.querySelectorAll('.tool').forEach(b => {
            b.classList.toggle('active', b.dataset.tool === t);
        });
    },

    setColor(c) {
        this.color = c;
        document.querySelectorAll('.swatch').forEach((el, i) => {
            el.classList.toggle('active', COLORS[i] === c);
        });
    },

    undo() {
        if (this.draft) this.draft = null;
        else this.shapes.pop();
        this.redraw();
        this.updateButtons();
    },

    updateButtons() {
        document.getElementById('undoBtn').disabled = this.shapes.length === 0;
        document.getElementById('copyBtn').disabled = !this.img;
    },

    copy() {
        if (!this.img) return;
        send('copy', { image: this.canvas.toDataURL('image/png') });
    },

    close() {
        send('close');
    },

    // Physical key, so the shortcuts work on a Russian layout too; events
    // that carry no code (synthesised ones) fall back to the character.
    keyCode(e) {
        if (e.code) return e.code;
        const k = (e.key || '').toLowerCase();
        if (/^[a-z]$/.test(k)) return 'Key' + k.toUpperCase();
        if (/^[0-9]$/.test(k)) return 'Digit' + k;
        return '';
    },

    onKey(e) {
        const meta = e.metaKey || e.ctrlKey;
        const code = this.keyCode(e);
        if (e.key === 'Escape') {
            e.preventDefault();
            if (this.draft) this.cancelDraft(); else this.close();
            return;
        }
        if (e.key === 'Enter' || (meta && code === 'KeyC')) {
            e.preventDefault();
            this.copy();
            return;
        }
        if (meta && code === 'KeyZ') {
            e.preventDefault();
            this.undo();
            return;
        }
        if (meta || e.altKey) return;
        const tools = { KeyA: 'arrow', KeyR: 'rect', KeyL: 'line', KeyV: 'check' };
        if (tools[code]) {
            e.preventDefault();
            this.setTool(tools[code]);
            return;
        }
        const m = /^Digit([1-6])$/.exec(code);
        if (m) {
            e.preventDefault();
            this.setColor(COLORS[parseInt(m[1], 10) - 1]);
        }
    },
};

document.addEventListener('DOMContentLoaded', () => editor.init());
</script>
</body>
</html>
